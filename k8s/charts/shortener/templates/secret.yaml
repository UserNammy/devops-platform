{{- /*
Placeholder Secret for local/test installs only. In production set
secret.existingSecret and manage the Secret outside of Git.
*/ -}}
{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required when secret.existingSecret is empty" .Values.secret.databaseUrl | quote }}
{{- end }}
