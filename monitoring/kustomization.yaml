# Application-level monitoring resources, applied after kube-prometheus-stack:
#   kubectl apply -k monitoring/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - alerts/shortener-rules.yaml

configMapGenerator:
  - name: shortener-dashboard
    files:
      - dashboards/shortener.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
