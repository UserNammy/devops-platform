---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH from admin networks (rate limited)
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ admin_cidrs }}"

- name: Allow Kubernetes API from admin networks
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ admin_cidrs }}"

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

# Required by k3s: pod and service networks must reach the node.
# https://docs.k3s.io/installation/requirements#inbound-rules-for-k3s-nodes
- name: Allow k3s pod and service CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop:
    - 10.42.0.0/16
    - 10.43.0.0/16

- name: Set default policies and enable ufw
  community.general.ufw:
    state: enabled
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: allow }
