---
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    owner: root
    group: root
    mode: "0755"

- name: Install k3s {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s is running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Wait for the node to become Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=30s
  register: k3s_node_ready
  retries: 10
  delay: 10
  until: k3s_node_ready.rc == 0
  changed_when: false

- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Save kubeconfig locally (git-ignored)
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/kubeconfig"
    content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' + ansible_host + ':6443') }}"
    mode: "0600"
  delegate_to: localhost
  become: false
