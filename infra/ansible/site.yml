---
# Harden a fresh Ubuntu 24.04 server and install single-node k3s.
#
# 1. Bootstrap (a new Hetzner server only has root): create the deploy user.
#      ansible-playbook site.yml -e ansible_user=root --tags base
# 2. Everything else runs as `deploy` (see ansible.cfg); this step disables
#    root login, so it must not run as root:
#      ansible-playbook site.yml

- name: Harden server
  hosts: k3s_server
  become: true
  roles:
    - role: base
      tags: [base]
    - role: ssh_hardening
      tags: [ssh]
    - role: firewall
      tags: [firewall]
    - role: fail2ban
      tags: [fail2ban]
    - role: unattended_upgrades
      tags: [upgrades]

- name: Install k3s
  hosts: k3s_server
  become: true
  roles:
    - role: k3s
      tags: [k3s]
