---
# Non-root user that Ansible creates and then uses for every later run.
admin_user: deploy
admin_ssh_public_key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"

# Networks allowed to reach SSH and the Kubernetes API. Keep in sync with
# the Terraform `admin_cidrs` variable (the cloud firewall is the first layer).
admin_cidrs:
  - 0.0.0.0/0

ssh_port: 22

# Pinned k3s release; bump deliberately after reading the changelog.
k3s_version: v1.36.6+k3s1

unattended_upgrades_auto_reboot: false
unattended_upgrades_reboot_time: "04:00"
