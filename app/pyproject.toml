[project]
name = "shortener"
version = "0.1.0"
description = "Minimal URL shortener API used to demonstrate a code-to-production pipeline"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = [
  "B008", # FastAPI dependency injection uses calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
